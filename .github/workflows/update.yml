name: update-data

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 平日 8:30 JST（朝スキャン＋Telegram）
    - cron: "40 6 * * 1-5"    # 平日 15:40 JST（大引け後のデータ更新のみ）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - name: データ生成
        run: |
          mkdir -p public
          cp site/index.html public/index.html
          cp site/icon.png public/icon.png
          python generate_static.py --out public/data
      - name: Telegram通知（朝のみ）
        if: github.event.schedule != '40 6 * * 1-5'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python scan_cloud.py public/data/home.json
      - name: GitHub Pagesへ公開
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
      - name: 60日無活動による定期実行の自動停止よけ（毎月1日に空コミット）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
